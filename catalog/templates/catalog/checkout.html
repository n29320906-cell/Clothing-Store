<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .product {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            text-align: right;
            font-size: 25px;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">

        <h1>
            Checkout
        </h1>


        <form method="POST">

            {% csrf_token %}


            <label>
                Your name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


           <label>Phone</label>

<input
    type="text"
    name="phone"
    id="phone"
    placeholder="996555123456"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="12"
    minlength="9"
    required
    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
>


            <label>
                Address
            </label>

            <textarea
                name="address"
                placeholder="Enter your address"
                required
            ></textarea>


            <button type="submit">
                Place Order
            </button>

        </form>


        <a
            href="{% url 'cart' %}"
            class="back"
        >
            ← Back to Cart
        </a>

    </div>


    <div class="box">

        <h2>
            Your Order
        </h2>


        {% for item in items %}

            <div class="product">

                <span>
                    {{ item.product.name }}
                    ×
                    {{ item.quantity }}
                </span>

                <span>
                    ${{ item.subtotal }}
                </span>

            </div>

        {% endfor %}


        <div class="total">

            Total: ${{ total }}

        </div>

    </div>


</div>


</body>

</html>
