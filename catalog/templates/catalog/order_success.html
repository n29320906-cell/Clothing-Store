<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Order Successful</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        Order Successful!
    </h1>


    <p>
        Thank you for your order,
        {{ order.name }}!
    </p>


    <p>
        Order number:
        <strong>
            #{{ order.id }}
        </strong>
    </p>


    <p>
        Total:
        <strong>
            ${{ order.total }}
        </strong>
    </p>


    <a
        href="/"
        class="button"
    >
        Continue Shopping
    </a>

</div>


</body>

</html>
